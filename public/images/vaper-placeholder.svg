<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#242014" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#121212" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>

    <!-- Gold Gradients for Metallic Accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D580"/>
      <stop offset="35%" stop-color="#C9A227"/>
      <stop offset="70%" stop-color="#E8C868"/>
      <stop offset="100%" stop-color="#8F6F14"/>
    </linearGradient>

    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="30%" stop-color="#2E2E2E"/>
      <stop offset="50%" stop-color="#3A3A3A"/>
      <stop offset="70%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>

    <linearGradient id="mouthpieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Delicate luxury circular ring in background -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.12"/>

  <!-- Device Container with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Mouthpiece -->
    <path d="M 350 210 C 350 185, 365 170, 400 170 C 435 170, 450 185, 450 210 L 458 240 L 342 240 Z" fill="url(#mouthpieceGrad)" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6"/>
    <ellipse cx="400" cy="180" rx="20" ry="5" fill="#0A0A0A" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Gold Accent Ring between Mouthpiece and Body -->
    <rect x="338" y="238" width="124" height="6" rx="3" fill="url(#goldGradient)" filter="url(#goldGlow)" opacity="0.85"/>

    <!-- Main Device Body (Sleek Box / Pod Shape) -->
    <rect x="320" y="244" width="160" height="290" rx="36" fill="url(#bodyGradient)" stroke="#333333" stroke-width="2"/>

    <!-- Left & Right Highlights on Body for 3D metallic feel -->
    <rect x="322" y="246" width="156" height="286" rx="34" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.4"/>
    
    <!-- Central Display/Logo Strip -->
    <rect x="345" y="290" width="110" height="150" rx="16" fill="#0D0D0D" stroke="#222222" stroke-width="1.5"/>

    <!-- Sleek Minimalist VAPE Icon / Emblem -->
    <g transform="translate(400, 345)" text-anchor="middle">
      <!-- Minimalist geometric logo -->
      <polygon points="0,-22 18,12 -18,12" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="2" r="4" fill="url(#goldGradient)"/>
      <text y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="url(#goldGradient)">PREMIUM</text>
      <text y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#888888">DISPOSABLE</text>
    </g>

    <!-- Airflow / Base Gold Accents -->
    <rect x="340" y="475" width="120" height="3" rx="1.5" fill="#222222"/>
    <rect x="355" y="485" width="90" height="2" rx="1" fill="#1C1C1C"/>

    <!-- Base LED Glow Indicator -->
    <ellipse cx="400" cy="520" rx="28" ry="4" fill="url(#goldGradient)" filter="url(#goldGlow)" opacity="0.9"/>
  </g>

  <!-- Bottom Label in luxury gold typography -->
  <g transform="translate(400, 620)" text-anchor="middle">
    <text font-family="'Playfair Display', serif" font-size="20" font-weight="600" letter-spacing="2" fill="url(#goldGradient)">
      DISPOSITIVO VAPE
    </text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#A3A3A3">
      IMAGEN ILUSTRATIVA · PROXIMAMENTE FOTO REAL
    </text>
  </g>
</svg>
